name: Free-tier preflight and quota check

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "عدد الفيديوهات المخططة في اليوم"
        required: true
        default: "12"
      scenes_per_video:
        description: "عدد المشاهد في كل فيديو"
        required: true
        default: "4"
      target_seconds:
        description: "المدة المتوقعة لكل فيديو بالثانية"
        required: true
        default: "90"
      acknowledge_gemini_tts_limit:
        description: "اكتب true بعد مراجعة حد Gemini TTS المؤكد: 10 طلبات/يوم"
        required: true
        default: "true"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in GEMINI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "val=\$$v"
            if [ -z "$val" ]; then
              echo "ABORT: missing $v"
              exit 1
            fi
            echo "PRESENT: $v"
          done

      - name: Check documented free-tier budgets
        env:
          VIDEOS: ${{ github.event.inputs.videos }}
          SCENES: ${{ github.event.inputs.scenes_per_video }}
          TARGET: ${{ github.event.inputs.target_seconds }}
          ACK: ${{ github.event.inputs.acknowledge_gemini_tts_limit }}
        run: |
          for v in VIDEOS SCENES TARGET; do
            eval "val=\$$v"
            case "$val" in
              ''|*[!0-9]*) echo "ABORT: $v must be a positive integer"; exit 1 ;;
            esac
          done
          if [ "$VIDEOS" -lt 1 ] || [ "$VIDEOS" -gt 20 ]; then
            echo "ABORT: videos must be between 1 and 20"
            exit 1
          fi
          if [ "$SCENES" -lt 2 ] || [ "$SCENES" -gt 4 ]; then
            echo "ABORT: scenes_per_video must be between 2 and 4"
            exit 1
          fi
          if [ "$TARGET" -lt 45 ] || [ "$TARGET" -gt 180 ]; then
            echo "ABORT: target_seconds must be between 45 and 180"
            exit 1
          fi
          echo "Gemini TTS free limit confirmed by API: 10 requests/day"
          if [ "$ACK" != "true" ]; then
            echo "ABORT: Gemini TTS 10/day limit not acknowledged"
            exit 1
          fi
          if [ "$VIDEOS" -gt 10 ]; then
            echo "ABORT: $VIDEOS videos exceed the confirmed Gemini TTS limit of 10 requests/day"
            exit 1
          fi

          neuron_limit=10000
          image_neurons=$((VIDEOS * SCENES * 100))
          whisper_neurons=$(awk -v v="$VIDEOS" -v t="$TARGET" 'BEGIN {printf "%.0f", v * (t/60) * 46.63}')
          needed=$((image_neurons + whisper_neurons))
          if [ "$needed" -gt "$neuron_limit" ]; then
            echo "ABORT: Cloudflare Neurons needed=$needed exceeds free daily limit=$neuron_limit"
            exit 1
          fi

          tts_requests=$VIDEOS
          text_requests=$VIDEOS
          echo "Cloudflare Workers AI: images=$image_neurons + whisper=$whisper_neurons = $needed/$neuron_limit Neurons/day"
          echo "Gemini requests planned: text=$text_requests, tts=$tts_requests (1 per video)"
          echo "GitHub Actions: public repo hosted runner, no local render, no paid fallback"
          echo "Artifacts: temporary only; deleted after local download"

          echo "VIDEOS=$VIDEOS" >> "$GITHUB_ENV"
          echo "SCENES=$SCENES" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "NEEDED_NEURONS=$needed" >> "$GITHUB_ENV"
          echo "TTS_REQUESTS=$tts_requests" >> "$GITHUB_ENV"

      - name: Cost and fallback guard
        run: |
          echo "SPEND_LIMIT_USD=0"
          echo "PAID_FALLBACK=false"
          echo "NO_LOCAL_AI_OR_RENDER=true"
          echo "PREFLIGHT OK: videos=$VIDEOS scenes_per_video=$SCENES target=$TARGET neurons=$NEEDED_NEURONS/10000 tts_requests=$TTS_REQUESTS/10"
