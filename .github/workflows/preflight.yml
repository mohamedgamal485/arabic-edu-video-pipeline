name: Free-tier preflight and quota check

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "عدد الفيديوهات المخططة في اليوم"
        required: true
        default: "12"
      scenes_per_video:
        description: "عدد المشاهد في كل فيديو"
        required: true
        default: "3"
      acknowledge_unpublished_gemini_rpd:
        description: "اكتب true لقبول أن حد Gemini اليومي غير منشور رسمياً"
        required: true
        default: "true"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in GEMINI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "val=\$$v"
            if [ -z "$val" ]; then
              echo "ABORT: missing $v"
              exit 1
            fi
            echo "PRESENT: $v"
          done

      - name: Check documented free-tier budgets
        env:
          VIDEOS: ${{ github.event.inputs.videos }}
          SCENES: ${{ github.event.inputs.scenes_per_video }}
          ACK: ${{ github.event.inputs.acknowledge_unpublished_gemini_rpd }}
        run: |
          for v in VIDEOS SCENES; do
            eval "val=\$$v"
            case "$val" in
              ''|*[!0-9]*) echo "ABORT: $v must be a positive integer"; exit 1 ;;
            esac
          done
          if [ "$VIDEOS" -lt 1 ] || [ "$VIDEOS" -gt 20 ]; then
            echo "ABORT: videos must be between 1 and 20"
            exit 1
          fi
          if [ "$SCENES" -lt 2 ] || [ "$SCENES" -gt 4 ]; then
            echo "ABORT: scenes_per_video must be between 2 and 4"
            exit 1
          fi
          echo "Gemini text and TTS: officially free of charge; exact free RPD is not published"
          if [ "$ACK" != "true" ]; then
            echo "ABORT: unpublished Gemini RPD not acknowledged"
            exit 1
          fi
          echo "Gemini RPD: unpublished; allowed by explicit input; production aborts immediately on 429/quota"

          neurons_per_image=100
          neuron_limit=10000
          needed=$((VIDEOS * SCENES * neurons_per_image))
          if [ "$needed" -gt "$neuron_limit" ]; then
            echo "ABORT: Cloudflare Neurons needed=$needed exceeds free daily limit=$neuron_limit"
            exit 1
          fi

          tts_requests=$((VIDEOS * SCENES))
          text_requests=$VIDEOS
          echo "Cloudflare Workers AI: conservative budget=$needed/$neuron_limit Neurons/day"
          echo "Gemini requests planned: text=$text_requests, tts=$tts_requests"
          echo "GitHub Actions: public repo hosted runner, no local render, no paid fallback"
          echo "Artifacts: temporary only; deleted after local download"

          echo "VIDEOS=$VIDEOS" >> "$GITHUB_ENV"
          echo "SCENES=$SCENES" >> "$GITHUB_ENV"
          echo "NEEDED_NEURONS=$needed" >> "$GITHUB_ENV"
          echo "TTS_REQUESTS=$tts_requests" >> "$GITHUB_ENV"

      - name: Cost and fallback guard
        run: |
          echo "SPEND_LIMIT_USD=0"
          echo "PAID_FALLBACK=false"
          echo "NO_LOCAL_AI_OR_RENDER=true"
          echo "PREFLIGHT OK: videos=$VIDEOS scenes_per_video=$SCENES neurons=$NEEDED_NEURONS/10000 tts_requests=$TTS_REQUESTS"
