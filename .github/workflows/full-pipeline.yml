name: Full Arabic video pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو"
        required: true
        default: "كيف بنيت الأهرامات؟"
      scenes:
        description: "عدد المشاهد (2-4)"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install cloud tools and Arabic font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ffmpeg fonts-noto-core
          ffmpeg -version | head -n 1
          fc-match "Noto Sans Arabic" | head -n 1

      - name: Preflight secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in GEMINI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "val=\$$v"
            if [ -z "$val" ]; then
              echo "MISSING: $v"
              exit 1
            else
              echo "PRESENT: $v"
            fi
          done

      - name: Choose free Gemini text model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out
          code=$(curl -sS -o models.json -w "%{http_code}" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models")
          [ "$code" = "200" ] || { cat models.json; exit 1; }
          for m in gemini-3-flash gemini-2.5-flash gemini-2.0-flash gemini-flash-latest gemini-1.5-flash; do
            if jq -e --arg m "models/$m" \
              '.models[]? | select(.name==$m) | select((.supportedGenerationMethods // []) | index("generateContent"))' \
              models.json >/dev/null; then
              echo "$m" > text_model.txt
              break
            fi
          done
          if [ ! -s text_model.txt ]; then
            echo "No allowed free text model found"
            jq -r '.models[]?.name' models.json | head -n 40
            exit 1
          fi
          echo "Text model: $(cat text_model.txt)"

      - name: Research and write Egyptian script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          SCENES: ${{ github.event.inputs.scenes }}
        run: |
          model=$(cat text_model.txt)
          prompt="أنت كاتب محتوى تعليمي مصري. ابحث في معلوماتك عن الموضوع ده: $TOPIC. اكتب نصًا مصريًا طبيعيًا، جمل قصيرة، من غير فصحى تقيلة، ومن غير أي موسيقى. المطلوب JSON فقط بالشكل ده: {\"facts\":[\"حقيقة مختصرة\",\"حقيقة مختصرة\"],\"scenes\":[{\"text\":\"جملة أو جملتان للمشهد\",\"image_prompt\":\"وصف صورة تعليمية بالإنجليزية، بدون أي نص داخل الصورة\"}]}. عدد المشاهد لازم يكون $SCENES بالظبط. كل نص مشهد لازم يقرأ في 6 لحد 12 ثانية. الصور لازم تكون رسوم تعليمية نظيفة ومناسبة لقناة تعليمية، بدون موسيقى."
          jq -n --arg model "$model" --arg prompt "$prompt" \
            '{model:$model,contents:[{role:"user",parts:[{text:$prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.7}}' \
            > script_request.json
          code=$(curl -sS -o script_response.json -w "%{http_code}" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @script_request.json)
          echo "Script HTTP: $code"
          [ "$code" = "200" ] || { cat script_response.json; exit 1; }
          jq -r '.candidates[0].content.parts[0].text // empty' script_response.json > script_raw.json
          jq -e 'select(.scenes and (.scenes | length > 0))' script_raw.json > storyboard.json 2>/dev/null || {
            sed -n '/^{/,/^}/p' script_raw.json | jq -e 'select(.scenes and (.scenes | length > 0))' > storyboard.json || { cat script_raw.json; exit 1; }
          }
          echo "Scenes: $(jq '.scenes | length' storyboard.json)"
          jq -r '.facts[]' storyboard.json

      - name: Generate Egyptian Arabic narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          n=$(jq '.scenes | length' storyboard.json)
          : > durations.txt
          : > audio_list.txt
          i=0
          while [ "$i" -lt "$n" ]; do
            text=$(jq -r ".scenes[$i].text" storyboard.json)
            jq -n --arg text "$text" \
              '{model:"gemini-3.8-flash-tts",input:[{type:"user_input",content:[{type:"text",text:$text,annotations:[{type:"speech_metadata",style:"warm, friendly, casual Egyptian storytelling"}]}]}],response_format:{type:"audio"},generation_config:{speech_config:[{voice:"ar-eg-tutor-5"}]}}' \
              > tts_req.json
            code=$(curl -sS -o tts_resp.json -w "%{http_code}" \
              -X POST "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @tts_req.json)
            echo "TTS scene $i HTTP: $code"
            [ "$code" = "200" ] || { cat tts_resp.json; exit 1; }
            jq -r '[.steps[] | select(.type=="model_output") | .content[] | select(.type=="audio")] | last | .data' tts_resp.json | base64 --decode > "scene_$i.wav"
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "scene_$i.wav")
            echo "$d" >> durations.txt
            echo "file 'scene_$i.wav'" >> audio_list.txt
            i=$((i+1))
          done
          ffmpeg -y -f concat -safe 0 -i audio_list.txt -ar 24000 -ac 1 -c:a pcm_s16le out/narration.wav
          ls -lh scene_*.wav out/narration.wav

      - name: Generate scene images
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          n=$(jq '.scenes | length' storyboard.json)
          i=0
          while [ "$i" -lt "$n" ]; do
            prompt=$(jq -r ".scenes[$i].image_prompt" storyboard.json)
            jq -n --arg prompt "$prompt" '{prompt:$prompt,steps:4}' > image_req.json
            code=$(curl -sS -o image_resp.json -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d @image_req.json)
            echo "Image scene $i HTTP: $code"
            [ "$code" = "200" ] || { cat image_resp.json; exit 1; }
            jq -r '.result.image' image_resp.json | base64 --decode > "scene_$i.jpg"
            i=$((i+1))
          done
          file scene_*.jpg

      - name: Build subtitles and render video
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          story = json.loads(Path("storyboard.json").read_text(encoding="utf-8"))
          durations = [float(x) for x in Path("durations.txt").read_text().split()]
          def ts(sec):
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = sec % 60
              return f"{h:02d}:{m:02d}:{s:06.3f}".replace(".", ",")
          start = 0.0
          lines = []
          vlist = []
          for i, scene in enumerate(story["scenes"]):
              d = durations[i]
              lines.append(str(i + 1))
              lines.append(f"{ts(start)} --> {ts(start + d)}")
              lines.append(scene["text"])
              lines.append("")
              vlist.append(f"file 'seg_{i}.mp4'")
              start += d
          Path("subtitles.srt").write_text("\n".join(lines), encoding="utf-8")
          Path("video_list.txt").write_text("\n".join(vlist) + "\n", encoding="utf-8")
          print(Path("subtitles.srt").read_text(encoding="utf-8"))
          PY
          n=$(jq '.scenes | length' storyboard.json)
          i=0
          while [ "$i" -lt "$n" ]; do
            d=$(sed -n "$((i+1))p" durations.txt)
            ffmpeg -y -loop 1 -i "scene_$i.jpg" -t "$d" \
              -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,zoompan=z='min(zoom+0.0004,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1920x1080:fps=30,format=yuv420p" \
              -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p "seg_$i.mp4"
            i=$((i+1))
          done
          ffmpeg -y -f concat -safe 0 -i video_list.txt -c copy video_only.mp4
          ffmpeg -y -i video_only.mp4 -i out/narration.wav \
            -vf "subtitles=subtitles.srt:force_style='FontName=Noto Sans Arabic,FontSize=30,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=0,MarginV=70,Alignment=2'" \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -shortest -movflags +faststart out/final.mp4
          cp storyboard.json out/script.json
          cp subtitles.srt out/subtitles.srt
          ls -lh out/final.mp4

      - name: QC
        run: |
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,duration -show_entries format=duration,size -of default=nw=1 out/final.mp4
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/final.mp4)
          size=$(stat -c%s out/final.mp4)
          awk -v d="$dur" 'BEGIN { if (d < 10) exit 1 }' || { echo "FAIL: duration too short"; exit 1; }
          [ "$size" -gt 100000 ] || { echo "FAIL: file too small"; exit 1; }
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 out/final.mp4 | grep -q . || { echo "FAIL: no audio"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 out/final.mp4 | grep -q . || { echo "FAIL: no video"; exit 1; }
          echo "QC OK: duration=$dur size=$size"

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: arabic-video
          path: |
            out/final.mp4
            out/script.json
            out/subtitles.srt
          retention-days: 1
